# Dependabot configuration.
#
# Security updates are enabled separately in the GitHub repository settings and
# run independently of this file. This file enables *version* updates: weekly
# checks for newer releases of our dependencies, opened as pull requests.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees:
      - mullzk
    # Bundle minor/patch bumps into a single PR. bundler-audit in CI
    # checks the whole lockfile, so a lone gem bump can stay red while
    # an unrelated transitive advisory is still open; one grouped PR
    # keeps the audit all-or-nothing check satisfiable. Majors stay
    # separate for deliberate review.
    groups:
      ruby-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees:
      - mullzk
    groups:
      github-actions:
        patterns:
          - "*"
